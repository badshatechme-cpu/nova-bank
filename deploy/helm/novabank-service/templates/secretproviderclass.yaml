apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.serviceAccount.name }}-secrets
  namespace: {{ .Values.namespace }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.serviceAccount.clientId | quote }}
    keyvaultName: {{ .Values.azure.keyVaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.database.passwordSecretName }}
          objectType: secret
        - |
          objectName: appinsights-connection-string
          objectType: secret
  # Syncs the same Key Vault values into native Kubernetes Secrets, so the Deployment can
  # reference them as normal env vars instead of parsing the mounted files.
  secretObjects:
    - secretName: {{ .Values.serviceAccount.name }}-db-secret
      type: Opaque
      data:
        - objectName: {{ .Values.database.passwordSecretName }}
          key: password
    - secretName: {{ .Values.serviceAccount.name }}-appinsights-secret
      type: Opaque
      data:
        - objectName: appinsights-connection-string
          key: connectionString
