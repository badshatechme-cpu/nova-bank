apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.serviceAccount.name }}-secrets
  namespace: {{ .Values.namespace }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.serviceAccount.clientId | quote }}
    keyvaultName: {{ .Values.azure.keyVaultName | quote }}
    tenantId: {{ .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.database.passwordSecretName }}
          objectType: secret
  # Syncs the same Key Vault value into a native Kubernetes Secret, so the Deployment
  # can reference it as a normal env var instead of parsing the mounted file.
  secretObjects:
    - secretName: {{ .Values.serviceAccount.name }}-db-secret
      type: Opaque
      data:
        - objectName: {{ .Values.database.passwordSecretName }}
          key: password
